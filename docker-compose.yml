# 서버(VPS) 배포용. 실행: POSTGRES_PASSWORD와 DOMAIN을 .env에 넣고 `docker compose up -d`
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: cuk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuk"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cuk:${POSTGRES_PASSWORD}@postgres:5432/cuk
      # 공고 DB도 같은 Postgres를 쓴다(컨테이너 안 파일 DB는 다시 빌드하면 사라진다)
      CAREER_DATABASE_URL: postgresql+psycopg://cuk:${POSTGRES_PASSWORD}@postgres:5432/cuk
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KSTARTUP_API_KEY: ${KSTARTUP_API_KEY:-}
      WORK24_API_KEY: ${WORK24_API_KEY:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
